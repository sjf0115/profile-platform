spring.profiles.active=dev
spring.application.name=profile-web
server.port=8080
#logging.config=classpath:logback.xml
management.server.port=7016

spring.main.allow-bean-definition-overriding=true

# MySQL 元数据库配置
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/profile?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.type-aliases-package=com.data.profile.model
spring.datasource.mapperLocations=classpath:mybatis/mapper/*.xml
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
mybatis.type-handlers-package=com.data.profile.handler
# 传入参数下划线方式转实体对象驼峰命名方式
spring.jackson.property-naming-strategy=SNAKE_CASE