spring.profiles.active=dev
spring.application.name=profile-web
server.port=8081
#logging.config=classpath:logback.xml
management.server.port=7016

spring.main.allow-bean-definition-overriding=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/profile?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.type-aliases-package=com.data.profile.web.model
spring.datasource.mapperLocations=classpath:mybatis/mapper/*.xml
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
mybatis.type-handlers-package=com.data.profile.web.handler
spring.jackson.property-naming-strategy=SNAKE_CASE