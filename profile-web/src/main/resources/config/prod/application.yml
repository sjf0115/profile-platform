server:
  port: 8080
#logging.config=classpath:logback.xml
management:
  server:
    port: 7016

spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: prod
  application:
    name: profile-web
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/profile?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true
    username: root
    password: root
  clickhouse:
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    url: jdbc:ch:http://localhost:8123/default
    username: test
    password: test
  authentication:
    providers:
      - passwd
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.data.profile.web.model
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.data.profile.web.handler
jwt:
  expireTime: 86400
  secretKey:
  algorithm: HS256

# 引擎全局配置参数
profile:
  engine:
    default-analysis-category: clickhouse
    default-di-category: DataX
    sync-channel: 3
    sync-error-record: 0
    sync-batch-size: 1000
    sync-write-mode: insert